name: Descomprimir proyecto

on:
  workflow_dispatch:

permissions:
  contents: write
  workflows: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extraer setup-boughazi-tv.sh
        run: bash setup-boughazi-tv.sh

      - name: Mover archivos a la raíz del repo
        run: |
          cp -r boughazi-tv-native/. .
          rm -rf boughazi-tv-native
          rm -f setup-boughazi-tv.sh

      - name: Subir los cambios
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Proyecto Boughazi TV actualizado (sin PayPal, con todas las correcciones)"
          git push
